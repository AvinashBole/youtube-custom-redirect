<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Custom Redirect Settings</title>
  <style>
    body { font: 15px system-ui, sans-serif; max-width: 640px; margin: 50px auto; padding: 0 20px; color: #222; }
    input[type=url] { box-sizing: border-box; width: 100%; padding: 12px; margin: 8px 0 12px; font: inherit; }
    button { padding: 10px 18px; cursor: pointer; }
    label { display: block; }
    p { color: #555; }
    #status { margin-top: 12px; }
  </style>
</head>
<body>
  <h2>YouTube Custom Redirect</h2>
  <p>When you open a YouTube video, redirect it to this URL. Use <code>{videoId}</code> to insert the clicked video's ID, or enter a fixed URL to send every video to the same page.</p>
  <form id="settings">
    <label for="url">Destination URL</label>
    <input id="url" type="url" placeholder="https://example.com/watch?v={videoId}" required>
    <label><input id="enabled" type="checkbox" checked> Enable redirects</label>
    <p><button type="submit">Save settings</button></p>
    <div id="status" role="status"></div>
  </form>
  <script src="options.js"></script>
</body>
</html>
